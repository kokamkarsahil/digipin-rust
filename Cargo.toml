[package]
name = "digipin"
version = "0.0.5"
edition = "2024"
rust-version = "1.85"
authors = ["Sahil"]
description = "Allocation-free, no_std DIGIPIN encoding and decoding with validated codes and geographic cell bounds"
license = "MIT"
repository = "https://github.com/kokamkarsahil/digipin-rust/"
keywords = ["geocoding", "location", "india-post", "coordinates", "digipin"]
categories = ["encoding", "algorithms", "no-std::no-alloc"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "MIGRATION.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
divan = { version = "3.0.4", package = "codspeed-divan-compat" }
serde_json = "1.0"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[[bench]]
name = "digipin_benches"
harness = false
